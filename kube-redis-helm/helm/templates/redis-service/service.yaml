{{- if .Values.redisService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "helm.fullname" . }}-redis-service
  labels:
    {{- include "helm.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis-service
spec:
  type: {{ .Values.redisService.service.type }}
  ports:
    - port: {{ .Values.redisService.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "helm.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis-service
{{- end }}