server.port=8082
spring.application.name=orders-sync-service

# AWS Configuration
aws.region=${AWS_REGION:us-east-1}

# DynamoDB Configuration
dynamodb.command.table.name=${DYNAMODB_COMMAND_TABLE:cqrs-orders-orders-command}
dynamodb.query.table.name=${DYNAMODB_QUERY_TABLE:cqrs-orders-orders-query}
dynamodb.stream.arn=${DYNAMODB_STREAM_ARN}

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Logging
logging.level.com.cqrs.orders=INFO
logging.level.software.amazon.awssdk=WARN
logging.level.software.amazon.kinesis=WARN

# Scheduling
spring.task.scheduling.pool.size=2