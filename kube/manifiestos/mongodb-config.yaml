apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-init-config
data:
  init-mongo.js: |
    // Switch to admin database to create user with proper permissions
    db = db.getSiblingDB('admin');
    
    // Create user with permissions on PRUEBA database
    db.createUser({
      user: "admin",
      pwd: "password123",
      roles: [
        { role: "readWrite", db: "PRUEBA" },
        { role: "dbAdmin", db: "PRUEBA" }
      ]
    });
    
    // Switch to PRUEBA database for CQRS operations
    db = db.getSiblingDB('PRUEBA');
    
    // Create indexes for better performance on ORDERS collection
    db.ORDERS.createIndex({ "customer_id": 1 });
    db.ORDERS.createIndex({ "order_id": 1 }, { unique: true });
    db.ORDERS.createIndex({ "created_at": 1 });
    db.ORDERS.createIndex({ "status": 1 });
    
    print("MongoDB PRUEBA database initialized successfully for CQRS - ready for operations");